<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>Search agent</h1>
    <button id="new" type="button">New chat</button>
  </header>
  <main id="log" aria-live="polite">
    <section id="empty">
      <p>Ask anything. Questions about earlier chats and recent changes work too.</p>
      <div class="examples">
        <button type="button">What did I ask you on Monday?</button>
        <button type="button">Has anything changed since last Tuesday?</button>
        <button type="button">Explain how Postgres MVCC works</button>
      </div>
    </section>
  </main>
  <form id="composer" autocomplete="off">
    <textarea id="input" rows="1" placeholder="Message" aria-label="Message" required></textarea>
    <button id="send" type="submit">Send</button>
  </form>
  <script type="module" src="/app.js"></script>
</body>
</html>
